name: WallSight iOS IPA Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          xcodebuild -version
      - name: Install XcodeGen
        run: |
          brew install xcodegen
      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
      - name: Compile unsigned iPhone app
        run: |
          xcodebuild -project WallSight.xcodeproj \
            -scheme WallSight \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/WallSight.app" Payload/
          zip -qry WallSight-unsigned.ipa Payload
      - name: Upload installation artifact
        uses: actions/upload-artifact@v4
        with:
          name: WallSight-iOS-Test
          path: WallSight-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
