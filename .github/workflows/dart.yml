
name: WallSight iOS IPA Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build WallSight
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build WallSight for iPhone
        run: |
          set -o pipefail
          xcodebuild \
            -project WallSight.xcodeproj \
            -scheme WallSight \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/WallSight.app Payload/
          zip -r WallSight-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WallSight-iOS-Test
          path: WallSight-unsigned.ipa
          if-no-files-found: error
